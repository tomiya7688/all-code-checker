name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/AllCodeChecker.Cli/AllCodeChecker.Cli.csproj

      - name: Build self
        run: dotnet build src/AllCodeChecker.Cli/AllCodeChecker.Cli.csproj -c Release --no-restore

      - name: Test core
        run: dotnet test src/AllCodeChecker.Core.Tests/AllCodeChecker.Core.Tests.csproj -c Release

      - name: CLI smoke test
        run: dotnet run --project src/AllCodeChecker.Cli/AllCodeChecker.Cli.csproj -c Release --no-build -- .

  self-quality-gate:
    name: self-quality-gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/AllCodeChecker.Cli/AllCodeChecker.Cli.csproj

      - name: Build with strict .NET analyzers
        run: >
          dotnet build src/AllCodeChecker.Cli/AllCodeChecker.Cli.csproj
          -c Release
          --no-restore
          -p:EnableNETAnalyzers=true
          -p:AnalysisLevel=latest-recommended
          -p:EnforceCodeStyleInBuild=true
          -p:TreatWarningsAsErrors=true

      - name: Bootstrap self-check entry point
        run: dotnet run --project src/AllCodeChecker.Cli/AllCodeChecker.Cli.csproj -c Release --no-build -- src

  design-checkers:
    name: design-checkers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout all-code-checker
        uses: actions/checkout@v4

      - name: Checkout UPD Commander design checker
        uses: actions/checkout@v4
        with:
          repository: tomiya7688/upd-commander-base-design
          ref: 1251d8eed5d555599d08e298220b511e426fc2e6
          path: .ci-tools/upd-commander-base-design

      - name: Checkout OOP design checker
        uses: actions/checkout@v4
        with:
          repository: tomiya7688/oop-design-checker
          ref: de30f85a84cab77b56723206424f9ad31608fe2a
          path: .ci-tools/oop-design-checker

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: UPD Commander design check
        working-directory: .ci-tools/upd-commander-base-design/support_tools/cs/upd_commander_checker
        run: >
          dotnet run --project UpdCommanderChecker.csproj -c Release
          -p:EnableNETAnalyzers=false
          -p:TreatWarningsAsErrors=false
          --
          "$GITHUB_WORKSPACE/src"

      - name: OOP design check
        working-directory: .ci-tools/oop-design-checker
        run: >
          dotnet run --project src/frontends/cui/OopDesignChecker.Cui.csproj -c Release
          -p:EnableNETAnalyzers=false
          -p:TreatWarningsAsErrors=false
          --
          "$GITHUB_WORKSPACE/src"
          --fail-on danger

  required:
    name: required
    runs-on: ubuntu-latest
    needs: [build, self-quality-gate, design-checkers]
    if: ${{ always() }}

    steps:
      - name: Require all CI gates
        shell: bash
        run: |
          test '${{ needs.build.result }}' = success
          test '${{ needs.self-quality-gate.result }}' = success
          test '${{ needs.design-checkers.result }}' = success
